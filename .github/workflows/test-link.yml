name: test-link

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # test-sync.sh's `--via skills` case needs Node >= 22.20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/test-link.sh
      - run: bash scripts/test-sync.sh
